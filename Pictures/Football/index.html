    <script>
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : {};
          if (target && target.fetch) {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc) {
              var isReadOnly = (desc.writable === false) || (desc.get !== undefined && desc.set === undefined);
              if (isReadOnly && desc.configurable !== false) {
                var currentFetch = target.fetch;
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    console.warn("Intercepted fetch reassignment to prevent crash:", val);
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          }
        } catch (e) {
          console.warn("Failsafe fetch patch skipped:", e);
        }
      })();
    </script>
