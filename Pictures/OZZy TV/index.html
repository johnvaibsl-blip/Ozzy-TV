<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozzy TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M23 7l-7 5 7 5V7z"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
                <span>Ozzy TV</span>
            </div>
            <div class="header-right">
                <a href="https://t.me/livesports26" target="_blank" class="tg-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295l.213-3.053 5.56-5.022c.24-.213-.054-.334-.373-.121L8.32 13.617l-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
                    </svg>
                    Telegram
                </a>
                <span class="channel-count" id="channelCount">0 channels</span>
            </div>
        </header>

        <div class="content">
            <div class="player-box">
                <video id="video" controls></video>
                <div class="placeholder" id="placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="40" height="40">
                        <path d="M23 7l-7 5 7 5V7z"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    <p>Select a channel</p>
                </div>
                <div class="loader" id="loader"><div class="spin"></div></div>
            </div>

            <div class="now-playing" id="nowPlaying">
                <div class="np-info">
                    <img id="npLogo" src="" alt="">
                    <div>
                        <h3 id="npName">No channel selected</h3>
                        <span id="npCat">--</span>
                    </div>
                </div>
            </div>

            <div class="bottom">
                <div class="search-row">
                    <div class="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search" placeholder="Search...">
                    </div>
                    <button class="srv-btn active" id="srvAllbtn" onclick="switchServer('All')">All</button>
                    <button class="srv-btn" id="srv5btn" onclick="switchServer('BDIX 1')">BDIX 1</button>
                    <button class="srv-btn" id="srv6btn" onclick="switchServer('BDIX 2')">BDIX 2</button>
                    <button class="srv-btn" id="srv1btn" onclick="switchServer('Server 1')">Server 1</button>
                    <button class="srv-btn" id="srv2btn" onclick="switchServer('Server 2')">Server 2</button>
                    <button class="srv-btn" id="srv3btn" onclick="switchServer('Server 3')">Server 3</button>
                    <button class="srv-btn" id="srv4btn" onclick="switchServer('Server 4')">Server 4</button>
                </div>
                <div class="cats" id="cats"></div>
                <div class="ch-list" id="chList">
                    <div class="loading-msg">Loading channels...</div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js?v=19"></script>
</body>
</html>
