<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozzy TV - Stream Movies, Series & Live TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a class="nav-logo" onclick="goHome()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span>Ozzy TV</span>
            </a>
            <div class="nav-links">
                <a class="nav-link active" data-section="home" onclick="navigate('home')">Home</a>
                <a class="nav-link" data-section="movies" onclick="navigate('movies')">Movies</a>
                <a class="nav-link" data-section="series" onclick="navigate('series')">Series</a>
                <a class="nav-link" data-section="live" onclick="navigate('live')">Live TV</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box" id="searchBox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="globalSearch" placeholder="Search movies, series..." oninput="handleSearch(this.value)">
                <kbd class="search-shortcut">ESC</kbd>
            </div>
            <a href="https://t.me/livesports26" target="_blank" class="nav-tg">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295l.213-3.053 5.56-5.022c.24-.213-.054-.334-.373-.121L8.32 13.617l-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg>
            </a>
        </div>
    </nav>

    <div class="app-body" id="appBody">
        <div class="home-view" id="homeView">
            <div class="hero" id="hero"></div>
            <div class="rows-container" id="rowsContainer"></div>
        </div>
        <div class="browse-view" id="browseView" style="display:none">
            <div class="browse-header">
                <h2 id="browseTitle"></h2>
                <div class="browse-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="browseSearch" placeholder="Filter..." oninput="filterBrowse(this.value)">
                </div>
            </div>
            <div class="browse-grid" id="browseGrid"></div>
        </div>
        <div class="search-results" id="searchResults" style="display:none">
            <div class="browse-header"><h2>Search Results</h2></div>
            <div class="browse-grid" id="searchGrid"></div>
        </div>
    </div>

    <div class="player-overlay" id="playerOverlay" style="display:none">
        <div class="player-header">
            <button class="player-back" onclick="closePlayer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="player-title" id="playerTitle"></div>
        </div>
        <div class="player-container">
            <video id="video" controls autoplay></video>
            <div class="player-loader" id="playerLoader"><div class="spin"></div></div>
        </div>
        <div class="streams-panel" id="streamsPanel"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
