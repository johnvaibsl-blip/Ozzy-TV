<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozzy TV - Stream Movies, Series & Live TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.12.12/dist/controls.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo" onclick="navigate('home')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span class="logo-text">Ozzy TV</span>
            </div>
            <div class="sidebar-nav">
                <a class="sidebar-item active" data-section="home" onclick="navigate('home')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Board</span>
                </a>
                <a class="sidebar-item" data-section="movies" onclick="navigate('movies')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
                    <span>Movies</span>
                </a>
                <a class="sidebar-item" data-section="series" onclick="navigate('series')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                    <span>Series</span>
                </a>
                <a class="sidebar-item" data-section="live" onclick="navigate('live')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 010 8.49m-8.48-.01a6 6 0 010-8.49m11.31-2.82a10 10 0 010 14.14m-14.14 0a10 10 0 010-14.14"/></svg>
                    <span>Live TV</span>
                </a>
                <a class="sidebar-item" data-section="search" onclick="focusSearch()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <span>Search</span>
                </a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <a class="sidebar-item" href="https://t.me/livesports26" target="_blank">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295l.213-3.053 5.56-5.022c.24-.213-.054-.334-.373-.121L8.32 13.617l-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg>
                <span>Telegram</span>
            </a>
        </div>
    </nav>

    <!-- MOBILE HEADER -->
    <div class="mobile-header" id="mobileHeader">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="mobile-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            <span>Ozzy TV</span>
        </div>
        <button class="mobile-search-btn" onclick="focusSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        <!-- TOP BAR -->
        <div class="topbar" id="topbar">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="globalSearch" placeholder="Search movies, series, channels..." oninput="handleSearch(this.value)">
            </div>
        </div>

        <!-- HOME VIEW -->
        <div class="view" id="homeView">
            <div class="hero" id="hero"></div>
            <div class="rows-container" id="rowsContainer"></div>
        </div>

        <!-- BROWSE VIEW -->
        <div class="view browse-view" id="browseView" style="display:none">
            <div class="browse-header">
                <h2 id="browseTitle"></h2>
            </div>
            <div class="browse-grid" id="browseGrid"></div>
        </div>

        <!-- SEARCH RESULTS -->
        <div class="view search-results" id="searchResults" style="display:none">
            <div class="browse-header"><h2>Search Results</h2></div>
            <div class="browse-grid" id="searchGrid"></div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="detail-modal" id="detailModal" style="display:none" onclick="closeDetail(event)">
        <div class="detail-content" id="detailContent"></div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div class="player-overlay" id="playerOverlay" style="display:none">
        <div class="player-header">
            <button class="player-back" onclick="closePlayer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="player-title" id="playerTitle"></div>
        </div>
        <div class="player-body" id="playerBody">
            <div class="player-container">
                <video id="video" controls playsinline></video>
                <div class="player-loader" id="playerLoader"><div class="spin"></div></div>
            </div>
            <div class="streams-panel" id="streamsPanel"></div>
        </div>
        <!-- iframe player -->
        <div class="iframe-player" id="iframePlayer" style="display:none">
            <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" frameborder="0"></iframe>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.12.12/dist/shaka-player.ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@2.5.1/webtorrent.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
